name: Python security and authentication
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '46 9 * * 1'
permissions:
  contents: read
concurrency:
  group: python-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        installer: [requirements, pipenv]
    env:
      PIPENV_VENV_IN_PROJECT: '1'
      PIPENV_NOSPIN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install validation tools
        run: python -m pip install --upgrade pip pipenv==2026.9.1 pip-audit==2.10.1
      - name: Verify Pipfile lock hash
        run: python -m pipenv verify
      - name: Install exported requirements
        if: matrix.installer == 'requirements'
        run: python -m pip install -r requirements.txt
      - name: Check exported installation and authentication
        if: matrix.installer == 'requirements'
        run: |
          python -m pip check
          python -m unittest discover -s tests -v
      - name: Install lockfile
        if: matrix.installer == 'pipenv'
        run: python -m pipenv sync
      - name: Check locked installation and authentication
        if: matrix.installer == 'pipenv'
        run: |
          python -m pipenv run python -m pip check
          python -m pipenv run python -m unittest discover -s tests -v
      - name: Audit pinned runtime requirements
        run: python -m pip_audit --no-deps --disable-pip -r requirements.txt
      - name: Check whitespace
        run: git diff --check
